plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}
version = rootProject.mod_version
group = rootProject.group
base { archivesName = 'sol_valheim-forge-1.20.1' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
repositories { maven { url = 'https://maven.shedaniel.me/' } }
sourceSets.main {
    java.srcDirs = [rootProject.file('common/src/main/java'), rootProject.file('common/src/versions/1.20.1/java'), 'src/main/java']
    resources.srcDirs = [rootProject.file('common/src/main/resources'), 'src/main/resources']
    resources.exclude '*.aw', '*.accesswidener'
}
legacyForge {
    version = "1.20.1-${rootProject.forge_version}"
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { sol_valheim { sourceSet sourceSets.main } }
}
dependencies {
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_1201}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'sol_valheim.refmap.json'
    config 'sol_valheim-common.mixins.json'
}
jar { manifest.attributes 'MixinConfigs': 'sol_valheim-common.mixins.json' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') { expand mod_version: project.version }
    filesMatching('sol_valheim-common.mixins.json') {
        filter { line -> line.replace('JAVA_21', 'JAVA_17').replace('"minVersion": "0.8",', '"minVersion": "0.8", "refmap": "sol_valheim.refmap.json",') }
    }
}
