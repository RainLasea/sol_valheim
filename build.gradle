plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144' apply false
    id 'fabric-loom' version '1.14.10' apply false
}
version = mod_version
group = 'vice.sol_valheim'
base { archivesName = 'sol_valheim-neoforge-1.21.1' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
}
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'common/src/versions/1.21.1/java', 'neoforge/src/main/java']
    resources.srcDirs = ['common/src/main/resources', 'neoforge/src/main/resources']
    resources.exclude '*.aw', '*.accesswidener'
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        sol_valheim {
            sourceSet sourceSets.main
        }
    }
    unitTest {
        enable()
        testedMod = mods.sol_valheim
    }
}
dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.mod_version
    }
}

test { useJUnitPlatform() }

// Collect installable jars after loader-specific remapping completes.
tasks.register('collectJars', Sync) {
    dependsOn tasks.named('jar'), ':fabric:build', ':fabric1201:build', ':forge:build'
    into layout.buildDirectory.dir('distributions')
    from(tasks.named('jar').flatMap { it.archiveFile })
    from(provider { project(':fabric').tasks.named('remapJar').get().archiveFile.get() })
    from(provider { project(':fabric1201').tasks.named('remapJar').get().archiveFile.get() })
    from(provider { project(':forge').tasks.named('reobfJar').get().archiveFile.get() })
}
tasks.named('build') { dependsOn 'collectJars' }
apply from: 'gradle/verify-artifacts.gradle'
tasks.named('build') { dependsOn 'verifyArtifacts' }
