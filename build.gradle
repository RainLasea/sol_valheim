plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = mod_version
group = 'vice.sol_valheim'
base { archivesName = 'sol_valheim-neoforge' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
}
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'neoforge/src/main/java']
    resources.srcDirs = ['common/src/main/resources', 'neoforge/src/main/resources']
    resources.exclude '*.aw', '*.accesswidener'
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        sol_valheim {
            sourceSet sourceSets.main
        }
    }
}
dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
processResources {
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.mod_version
    }
}
